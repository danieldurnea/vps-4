# iddi
  ssh-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 检出你的代码仓库

      - name: Choose mode ngrok (ubuntu)
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }} 
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          MODE=${{ github.event.inputs.mode }}
          bash ./linux-ssh.sh
        shell: bash
        
      - name: Sleep
        run: sleep 6h
